# Ruff 設定。
#
# 本プロジェクトはコメント・docstring を日本語で書くのが規約（CLAUDE.md「コミュニケーション」）。
# 日本語の全角記号（（）／「」／→／＝ など）は意図的な表記であり、これを ASCII へ直すと
# コードベース全体の文体と不整合になる。そのため「曖昧な Unicode 文字」検出ルールだけ無効化する:
#   RUF001 … 文字列リテラル内
#   RUF002 … docstring 内
#   RUF003 … コメント内
# ignore は select より優先されるため、どのプリセットでこれらが有効化されても抑止される
# （CI 自体は pytest のみ。これは ruff／CodeRabbit など外部 linter のノイズ抑止が目的）。
[lint]
ignore = ["RUF001", "RUF002", "RUF003"]
